<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="k-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e2534"/>
      <stop offset="40%" stop-color="#1d445e"/>
      <stop offset="72%" stop-color="#6c98a7"/>
      <stop offset="100%" stop-color="#e8c886"/>
    </linearGradient>
    <radialGradient id="k-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d4" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="k-lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5d879e"/>
      <stop offset="100%" stop-color="#2c4d60"/>
    </linearGradient>
    <linearGradient id="k-mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#k-sky)"/>
  <circle cx="580" cy="300" r="180" fill="url(#k-sun)"/>
  <circle cx="580" cy="300" r="38" fill="#fff2c8" opacity=".92"/>

  <!-- far ridges -->
  <path fill="#3b5769" opacity=".6"
    d="M0 330 L90 288 L170 320 L270 268 L370 312 L470 275 L580 318 L690 280 L800 315 L800 600 L0 600 Z"/>
  <path fill="#29404f" opacity=".85"
    d="M0 372 L110 325 L210 362 L320 308 L430 355 L540 315 L660 360 L770 322 L800 340 L800 600 L0 600 Z"/>
  <rect x="-40" y="352" width="900" height="34" fill="url(#k-mist)" opacity=".4"/>

  <!-- near ridge -->
  <path fill="#172935"
    d="M0 412 L120 372 L240 405 L360 362 L480 402 L600 365 L720 405 L800 382 L800 600 L0 600 Z"/>

  <!-- lake -->
  <path fill="url(#k-lake)" d="M0 452 L800 452 L800 600 L0 600 Z"/>
  <!-- sun reflection -->
  <g fill="#ffe6a8" opacity=".3">
    <rect x="548" y="470" width="64" height="5" rx="2.5"/>
    <rect x="556" y="490" width="48" height="4" rx="2"/>
    <rect x="544" y="510" width="72" height="4" rx="2"/>
    <rect x="558" y="532" width="44" height="3" rx="1.5"/>
  </g>
  <!-- ripples -->
  <g stroke="#ffffff" stroke-opacity=".16" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M60 486 q26 -7 52 0 q26 7 52 0"/>
    <path d="M180 522 q26 -7 52 0 q26 7 52 0"/>
    <path d="M40 556 q26 -7 52 0 q26 7 52 0"/>
    <path d="M640 500 q26 -7 52 0 q26 7 52 0"/>
    <path d="M690 546 q22 -6 44 0 q22 6 44 0"/>
  </g>

  <!-- rowing boat -->
  <g opacity=".9">
    <path d="M330 512 q40 26 88 0 q-44 12 -88 0 Z" fill="#4a2f18"/>
    <rect x="370" y="486" width="4" height="26" fill="#4a2f18"/>
    <path d="M374 488 l26 12 l-26 10 Z" fill="#f0e3c6"/>
  </g>

  <!-- pines on the near ridge -->
  <g fill="#0c1820">
    <path d="M62 400 l14 -52 l14 52 z M56 418 l20 -46 l20 46 z"/>
    <path d="M148 414 l11 -42 l11 42 z M143 428 l16 -38 l16 38 z"/>
    <path d="M270 396 l15 -56 l15 56 z M264 414 l21 -50 l21 50 z"/>
    <path d="M390 408 l12 -46 l12 46 z M384 424 l18 -42 l18 42 z"/>
    <path d="M660 400 l14 -52 l14 52 z M654 418 l20 -46 l20 46 z"/>
    <path d="M746 412 l11 -44 l11 44 z M741 428 l16 -40 l16 40 z"/>
  </g>

  <!-- foreground pine branch -->
  <g fill="#081116" opacity=".92">
    <path d="M0 600 L0 400 q40 30 44 78 q26 -32 58 -6 q-30 40 -74 46 q-12 44 -28 82 Z"/>
  </g>
</svg>
